<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1117">
  <meta name="description" content="Shinobi Auto-Battler — a fan-made Naruto-universe 2D auto-battler. Build a team, read the Nature Wheel, and time your Jutsu Clashes.">
  <title>Shinobi Auto-Battler</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23f0691f'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' font-family='sans-serif' font-weight='900' fill='%231b0f06'%3E%E5%BF%8D%3C/text%3E%3C/svg%3E">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Shinobi">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="brand" id="brand" title="Home"><div class="brand-mark" aria-hidden="true">忍</div><span class="title">Shinobi Auto-Battler</span></div>
      <div class="spacer"></div>
      <div class="currency" title="Scrolls — spend them to summon"><span class="ico">📜</span><span id="cur-scrolls">0</span></div>
      <div class="currency" title="Ryo — spend it to level up"><span class="ico">🪙</span><span id="cur-ryo">0</span></div>
      <button class="icon-btn" id="ach-btn" aria-label="Achievements" title="Achievements">🏆</button>
      <button class="icon-btn" id="mute-btn" aria-label="Toggle sound">🔊</button>
    </header>
    <main id="screen" aria-live="polite"><div class="screen boot-loading"><div class="spinner" aria-hidden="true"></div><p class="muted center">Loading…</p></div></main>
    <div id="install-banner" role="region" aria-label="Install the app" hidden></div>
    <nav id="tabbar" aria-label="Main"></nav>
  </div>
  <div id="battle" class="hidden" aria-label="Battle"></div>
  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <noscript><p style="padding:20px;color:#fff">This game needs JavaScript (ES modules).</p></noscript>
  <script>
    // The game couldn't start: a game file failed to download (the module script's
    // error event) or boot() threw (js/main.js). Plain DOM, no HTML from the error.
    window.showBootError = function (detail) {
      var el = document.getElementById('screen'); if (!el) return;
      var make = function (tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text) n.textContent = text; return n; };
      var card = make('div', 'card center');
      card.append(make('h2', '', 'The game couldn’t start'),
        make('p', '', 'Check your connection and reload the page. Your progress is saved in this browser (and online, if you use cloud save).'));
      var reload = make('button', 'btn primary', '↻ Reload'); reload.type = 'button'; reload.onclick = function () { location.reload(); };
      card.append(reload);
      if (detail) card.append(make('p', 'tiny muted', 'Details: ' + detail));
      var wrap = make('div', 'screen'); wrap.append(card);
      el.replaceChildren(wrap);
    };
  </script>
  <script type="module" src="js/main.js" onerror="showBootError('a game file failed to download')"></script>
</body>
</html>
